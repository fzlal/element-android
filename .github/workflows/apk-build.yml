name: APK Build

on:
  pull_request: { }
  push:
    branches: [ main, develop ]

permissions:
  contents: write  # این مهم است - اجازه می‌دهد به مخزن کامیت کند

# Enrich gradle.properties for CI/CD
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=1g" -Dkotlin.daemon.jvm.options="-Xmx2560m" -Dkotlin.incremental=false
  CI_GRADLE_ARG_PROPERTIES: --stacktrace -PpreDexEnable=false --max-workers 2 --no-daemon

jobs:
  debug:
    name: Build debug APKs (${{ matrix.target }})
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        target: [ Gplay, Fdroid ]
    concurrency:
      group: ${{ github.ref == 'refs/heads/develop' && format('integration-tests-develop-{0}-{1}', matrix.target, github.sha) || format('build-debug-{0}-{1}', matrix.target, github.ref)  }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true  # تغییر به true برای اجازه کامیت
          
      - name: Use JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
          
      - name: Assemble ${{ matrix.target }} debug apk
        run: ./gradlew assemble${{ matrix.target }}Debug $CI_GRADLE_ARG_PROPERTIES
        
      - name: Copy APK to repository folder
        run: |
          mkdir -p built-apks
          cp vector-app/build/outputs/apk/*/debug/*.apk built-apks/
          
      - name: Commit APK files to repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add built-apks/*.apk
          git commit -m "Add built APKs [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
          
      - name: Upload ${{ matrix.target }} debug APKs (as artifact)
        uses: actions/upload-artifact@v4
        with:
          name: vector-${{ matrix.target }}-debug
          path: vector-app/build/outputs/apk/*/debug/*.apk

  release:
    name: Build unsigned GPlay APKs
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref == 'refs/head/main' && format('build-release-apk-main-{0}', github.sha) || github.ref == 'refs/heads/develop' && format('build-release-apk-develop-{0}', github.sha) || format('build-debug-{0}', github.ref)  }}
      cancel-in-progress: ${{ github.ref != 'refs/head/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
          
      - name: Use JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
          
      - name: Assemble GPlay unsigned apk
        run: ./gradlew clean assembleGplayRelease $CI_GRADLE_ARG_PROPERTIES
        
      - name: Copy APK to repository folder
        run: |
          mkdir -p built-apks
          cp vector-app/build/outputs/apk/*/release/*.apk built-apks/
          
      - name: Commit APK files to repository
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add built-apks/*.apk
          git commit -m "Add release APK [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}
          
      - name: Upload Gplay unsigned APKs (as artifact)
        uses: actions/upload-artifact@v4
        with:
          name: vector-gplay-release-unsigned
          path: vector-app/build/outputs/apk/*/release/*.apk
